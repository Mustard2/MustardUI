[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["./armature/external/mhx"]

[tool.ruff.lint]
# E/F are defaults; "I" adds import sorting (isort)
# B: bugbear; RUF021: and/or without parentheses; PLW2901: overwritten loop variable
select = ["E", "F", "I", "B", "RUF021", "PLW2901"]
